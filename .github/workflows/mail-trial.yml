name: Mail trial

# Throwaway research workflow for issue #22. It lives only on this branch and is never merged.
on:
  push:
    branches: [research/ci-mail-trial]
    paths: ['.github/workflows/mail-trial.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }}, seed ${{ matrix.seed }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
        # none: never touch TCC and only record the consent prompt.
        # agent: one row in the user TCC.db for the runner agent, the process TCC holds responsible.
        # all: clone the image's Finder Automation rows for every client it lists, in both databases.
        seed: [none, agent, all]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MAILBOX: amail-ci-probe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Helpers
        run: |
          TRIAL="$HOME/amail-trial"
          echo "TRIAL=$TRIAL" >> "$GITHUB_ENV"
          mkdir -p "$TRIAL/shots" "$TRIAL/js"
          cat > "$TRIAL/lib.sh" <<'LIB'
          set +e
          set +o pipefail
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          clean() { printf '%s' "$1" | tr '\n\r|' '  /' | cut -c1-500; }
          # probe <name> <seconds> <command...>: run with a hard timeout, record exit code, stdout and stderr.
          probe() {
            local name=$1 seconds=$2 out err code
            shift 2
            out=$(limit "$seconds" "$@" 2>"$TRIAL/stderr.txt")
            code=$?
            err=$(cat "$TRIAL/stderr.txt")
            [ "$code" = 142 ] && err="TIMEOUT after ${seconds}s $err"
            echo "PROBE-RESULT | $name | exit=$code | stdout=$(clean "$out") | stderr=$(clean "$err")"
            echo "| $name | $code | \`$(clean "$out")\` | \`$(clean "$err")\` |" >> "$GITHUB_STEP_SUMMARY"
            return "$code"
          }
          shot() { limit 30 screencapture -x "$TRIAL/shots/$1.png" || echo "screencapture $1 failed: $?"; }
          windows() {
            limit 30 osascript -e 'tell application "System Events" to get {name, subrole, size} of every window of process "Mail"'
            limit 30 osascript -e 'tell application "System Events" to get name of every process whose visible is true'
          }
          LIB

          cat > "$TRIAL/js/version.js" <<'JS'
          function run() { return Application('Mail').version(); }
          JS
          cat > "$TRIAL/js/accounts.js" <<'JS'
          function run() { return Application('Mail').accounts.length; }
          JS
          cat > "$TRIAL/js/mailboxes.js" <<'JS'
          function run() {
            const Mail = Application('Mail');
            return JSON.stringify({ count: Mail.mailboxes.length, names: Mail.mailboxes.name() });
          }
          JS
          cat > "$TRIAL/js/make.js" <<'JS'
          function run(argv) {
            const Mail = Application('Mail');
            const mailbox = Mail.Mailbox({ name: argv[0] });
            Mail.mailboxes.push(mailbox);
            return Mail.mailboxes.byName(argv[0]).name();
          }
          JS
          cat > "$TRIAL/js/import.js" <<'JS'
          function run(argv) {
            const Mail = Application('Mail');
            return String(Mail.importMailMailbox({ at: Path(argv[0]) }));
          }
          JS
          cat > "$TRIAL/js/count.js" <<'JS'
          function run() {
            const Mail = Application('Mail');
            const walk = (boxes, prefix) => boxes.flatMap((box) => {
              const name = prefix + box.name();
              return [{ name: name, messages: box.messages.length }].concat(walk(box.mailboxes(), name + '/'));
            });
            return JSON.stringify(walk(Mail.mailboxes(), ''));
          }
          JS
          cat > "$TRIAL/js/subject.js" <<'JS'
          function run() {
            const Mail = Application('Mail');
            const find = (boxes) => {
              for (const box of boxes) {
                if (box.messages.length > 0) {
                  const message = box.messages[0];
                  return { mailbox: box.name(), subject: message.subject(), sender: message.sender(), content: message.content().trim() };
                }
                const nested = find(box.mailboxes());
                if (nested) return nested;
              }
              return null;
            };
            return JSON.stringify(find(Mail.mailboxes()));
          }
          JS

      - name: Environment
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          sw_vers
          uname -m
          csrutil status
          echo "Mail $(defaults read /System/Applications/Mail.app/Contents/Info CFBundleShortVersionString) ($(defaults read /System/Applications/Mail.app/Contents/Info CFBundleVersion))"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          echo "Responsible-process chain:"
          pid=$$
          while [ -n "$pid" ] && [ "$pid" -gt 0 ]; do
            ps -o pid=,ppid=,user=,command= -p "$pid" | cut -c1-200
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          echo "Console user: $(stat -f %Su /dev/console)"
          ls "$HOME/Library/Mail" 2>&1 | head -5
          {
            echo "## Mail trial on ${{ matrix.os }}, seed ${{ matrix.seed }}"
            echo
            echo "$(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), image $ImageOS $ImageVersion, $(csrutil status)"
            echo
            echo "| step | exit | stdout | stderr |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Existing TCC rows
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          USER_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 27 ]; then
            sudo find /private/var/containers/Data/ProtectedSystem -type f -path '*/com.apple.TCC/TCC.db' -print
            ACTIVE=$(sudo lsof -c tccd -Fn | sed -n 's/^n//p' | grep '/ProtectedSystem/.*/com\.apple\.TCC/TCC\.db$' | sort -u | head -1)
            [ -n "$ACTIVE" ] && USER_DB=$ACTIVE
          fi
          SYSTEM_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          echo "USER_DB=$USER_DB" >> "$GITHUB_ENV"
          echo "SYSTEM_DB=$SYSTEM_DB" >> "$GITHUB_ENV"
          for db in "$USER_DB" "$SYSTEM_DB"; do
            echo "TCC database: $db"
            sudo ls -l "$db"
            sudo sqlite3 "$db" "select cid, name, type from pragma_table_info('access')" | tr '\n' ' '
            echo
            sudo sqlite3 -header "$db" "select service, client, client_type, auth_value, auth_reason, auth_version, csreq is null as csreq_null, indirect_object_identifier_type, indirect_object_identifier, flags from access where service = 'kTCCServiceAppleEvents' order by client, indirect_object_identifier"
            echo "Rows mentioning Mail:"
            sudo sqlite3 "$db" "select service, client, auth_value, indirect_object_identifier from access where client like '%mail%' or indirect_object_identifier like '%mail%'"
          done

      - name: Mail without a grant
        if: matrix.seed == 'none'
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          # version() is answered from the bundle without launching Mail, so accounts.length is the first real Apple event.
          probe "unseeded: Mail.version()" 60 osascript -l JavaScript "$TRIAL/js/version.js"
          pgrep -lx Mail || echo "Mail is not running after version()"
          (sleep 25; shot before-seeding; windows) &
          probe "unseeded: accounts.length" 60 osascript -l JavaScript "$TRIAL/js/accounts.js"
          probe "unseeded: mailboxes.length" 60 osascript -l JavaScript "$TRIAL/js/mailboxes.js"
          wait
          pkill -x Mail
          sleep 3
          exit 0

      - name: Seed Automation rows for Mail
        if: matrix.seed != 'none'
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          # Clone the Finder Automation rows the image ships into rows that target Mail, keeping the image's own row shape.
          # A prompt that times out first leaves a deny row on macOS 27, so this runs before any Apple event reaches Mail.
          seed() {
            local db=$1 clients=$2 columns
            columns=$(sudo sqlite3 "$db" "select group_concat(case name when 'indirect_object_identifier' then '''com.apple.mail''' when 'last_modified' then 'cast(strftime(''%s'', ''now'') as integer)' else '\"' || name || '\"' end, ', ') from pragma_table_info('access')")
            echo "select list for $db: $columns"
            for attempt in 1 2 3 4 5; do
              sudo sqlite3 -cmd '.timeout 10000' "$db" "insert or replace into access select $columns from access where service = 'kTCCServiceAppleEvents' and indirect_object_identifier = 'com.apple.finder' and client like '$clients'" && return 0
              echo "insert into $db failed (attempt $attempt)"
              sleep $((attempt * 2))
            done
            return 1
          }
          if [ "${{ matrix.seed }}" = agent ]; then
            seed "$USER_DB" /opt/hca/hosted-compute-agent
            probe "seed user TCC.db (agent row only)" 5 sh -c "exit $?"
          else
            seed "$USER_DB" %
            probe "seed user TCC.db" 5 sh -c "exit $?"
            seed "$SYSTEM_DB" %
            probe "seed system TCC.db" 5 sh -c "exit $?"
          fi
          sudo killall tccd
          sleep 2
          for db in "$USER_DB" "$SYSTEM_DB"; do
            echo "Mail rows in $db:"
            sudo sqlite3 "$db" "select client, client_type, auth_value, indirect_object_identifier from access where service = 'kTCCServiceAppleEvents' and indirect_object_identifier = 'com.apple.mail'"
          done
          count=$(sudo sqlite3 "$USER_DB" "select count(*) from access where service = 'kTCCServiceAppleEvents' and indirect_object_identifier = 'com.apple.mail'")
          probe "seeded rows in user TCC.db" 10 echo "$count"

      - name: Launch Mail
        if: matrix.seed != 'none'
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          probe "open -g -a Mail" 60 open -g -a Mail
          sleep 25
          shot launched
          pgrep -lx Mail
          windows
          exit 0

      - name: Probe Mail
        if: matrix.seed != 'none'
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          probe "Mail.version()" 60 osascript -l JavaScript "$TRIAL/js/version.js"
          probe "accounts.length" 60 osascript -l JavaScript "$TRIAL/js/accounts.js"
          probe "mailboxes.length" 60 osascript -l JavaScript "$TRIAL/js/mailboxes.js"
          probe "make new mailbox (JXA)" 60 osascript -l JavaScript "$TRIAL/js/make.js" "$MAILBOX" ||
            probe "make new mailbox (AppleScript)" 60 osascript -e "tell application \"Mail\" to make new mailbox with properties {name:\"$MAILBOX\"}"
          probe "mailboxes after make" 60 osascript -l JavaScript "$TRIAL/js/mailboxes.js"
          shot after-make

          mkdir -p "$HOME/amail-ci/probe.mbox"
          {
            printf 'From alice@example.com Tue Nov 10 10:00:00 2026\nFrom: Alice Example <alice@example.com>\nTo: Bob Example <bob@example.com>\nSubject: amail ci probe one\nDate: Tue, 10 Nov 2026 10:00:00 +0000\nMessage-ID: <probe-one@example.com>\nMIME-Version: 1.0\nContent-Type: text/plain; charset=utf-8\n\nFirst invented message.\n\n'
            printf 'From carol@example.com Tue Nov 10 10:05:00 2026\nFrom: Carol Example <carol@example.com>\nTo: Bob Example <bob@example.com>\nSubject: amail ci probe two\nDate: Tue, 10 Nov 2026 10:05:00 +0000\nMessage-ID: <probe-two@example.com>\nMIME-Version: 1.0\nContent-Type: text/plain; charset=utf-8\n\nSecond invented message.\n\n'
          } > "$HOME/amail-ci/probe.mbox/mbox"
          cp "$HOME/amail-ci/probe.mbox/mbox" "$HOME/amail-ci/flat.mbox"
          probe "import Mail mailbox (package)" 90 osascript -l JavaScript "$TRIAL/js/import.js" "$HOME/amail-ci/probe.mbox" ||
            probe "import Mail mailbox (flat file)" 90 osascript -l JavaScript "$TRIAL/js/import.js" "$HOME/amail-ci/flat.mbox"
          sleep 15
          probe "mailboxes after import" 60 osascript -l JavaScript "$TRIAL/js/mailboxes.js"
          probe "message counts" 60 osascript -l JavaScript "$TRIAL/js/count.js"
          probe "read one subject" 60 osascript -l JavaScript "$TRIAL/js/subject.js"
          shot after-import
          windows
          exit 0

      - name: Build and run amail
        if: matrix.seed != 'none'
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          probe "go build" 300 go build -o amail .
          probe "amail accounts --json" 60 ./amail accounts --json
          probe "amail mailboxes --json" 60 ./amail mailboxes --json
          exit 0

      - name: Dismiss the add-account sheet
        if: matrix.seed != 'none'
        continue-on-error: true
        run: |
          source "$TRIAL/lib.sh"
          probe "sheets of Mail windows" 30 osascript -e 'tell application "System Events" to tell process "Mail" to get {name of every window, count of sheets of every window}'
          limit 30 osascript -e 'tell application "System Events" to tell process "Mail" to get {class, name, description} of every UI element of sheet 1 of window 1' | cut -c1-1500
          probe "press Escape on the sheet" 30 osascript -e 'tell application "System Events" to tell process "Mail"' -e 'set frontmost to true' -e 'delay 1' -e 'key code 53' -e 'end tell'
          sleep 8
          shot after-cancel
          probe "Mail still running after Cancel" 10 pgrep -lx Mail
          probe "accounts.length after Cancel" 60 osascript -l JavaScript "$TRIAL/js/accounts.js"
          probe "message counts after Cancel" 60 osascript -l JavaScript "$TRIAL/js/count.js"
          sleep 5
          shot final
          windows
          exit 0

      - name: TCC decisions
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: |
          source "$TRIAL/lib.sh"
          limit 180 log show --last 14m --predicate 'subsystem == "com.apple.TCC"' --style compact > "$TRIAL/tcc-full.log"
          grep -i -E 'AppleEvents|osascript|hosted-compute-agent' "$TRIAL/tcc-full.log" > "$TRIAL/tcc.log"
          wc -l "$TRIAL/tcc-full.log" "$TRIAL/tcc.log"
          rm -f "$TRIAL/tcc-full.log"
          echo "AppleEvents lines: $(grep -c AppleEvents "$TRIAL/tcc.log")"
          grep AppleEvents "$TRIAL/tcc.log" | cut -c1-700 | head -12
          echo "Lines naming osascript: $(grep -c osascript "$TRIAL/tcc.log")"
          grep osascript "$TRIAL/tcc.log" | cut -c1-700 | head -6
          for db in "$USER_DB" "$SYSTEM_DB"; do
            echo "Final Mail rows in $db:"
            sudo sqlite3 "$db" "select client, auth_value, auth_reason from access where service = 'kTCCServiceAppleEvents' and indirect_object_identifier = 'com.apple.mail'"
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Exit 142 means the hard timeout killed the command." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trial-${{ matrix.os }}-seed-${{ matrix.seed }}
          path: |
            ~/amail-trial/shots
            ~/amail-trial/tcc.log
          if-no-files-found: warn
